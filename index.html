<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QE BOT Dashboard</title>
  <style>
    :root {
      --bg: #070d18;
      --card-bg: rgba(12, 22, 39, 0.85);
      --border-cyan: #00e5ff;
      --neon-green: #00ff88;
      --neon-red: #ff3366;
      --text-dim: #73829c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Robot Banner Box */
    .banner-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid rgba(0, 229, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    .banner-container img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    /* HUD Glow Card */
    .hud-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-cyan);
      border-radius: 12px;
      padding: 12px 14px;
      position: relative;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.15), inset 0 0 8px rgba(0, 229, 255, 0.08);
    }

    .hud-card::before {
      content: '';
      position: absolute;
      top: -1.5px;
      left: 15%;
      width: 70%;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
    }

    /* Candlestick Chart Box */
    .chart-box {
      height: 240px;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Market Pair & Bid */
    .market-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol-title {
      font-size: 18px;
      font-weight: 800;
    }

    .trend-tag {
      display: inline-block;
      margin-top: 3px;
      padding: 2px 7px;
      font-size: 9.5px;
      font-weight: 700;
      border-radius: 4px;
      background: rgba(0, 255, 136, 0.15);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
    }

    .bid-side {
      text-align: right;
    }

    .bid-num {
      font-size: 22px;
      font-weight: 800;
      color: var(--border-cyan);
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
    }

    .bid-lbl {
      font-size: 9px;
      color: var(--text-dim);
      font-weight: 600;
    }

    /* Bot Execution Button */
    .bot-btn {
      width: 100%;
      padding: 11px;
      background: rgba(0, 255, 136, 0.08);
      border: 1.5px solid var(--neon-green);
      border-radius: 10px;
      color: var(--neon-green);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.15);
    }

    .dot-pulse {
      width: 7px;
      height: 7px;
      background: var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-green);
    }

    /* Metric Key-Value Row */
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-lbl {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .balance-txt {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
    }

    .profit-txt {
      font-size: 19px;
      font-weight: 800;
      color: var(--neon-green);
    }

    /* Two Columns Row */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-val-sm {
      font-size: 17px;
      font-weight: 800;
      margin-top: 4px;
    }

    /* Orders Section */
    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 2px 2px 2px;
    }

    .orders-title {
      color: var(--border-cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    .running-cnt {
      color: var(--neon-green);
      font-size: 11px;
      font-weight: 700;
    }

    .no-orders-box {
      text-align: center;
      padding: 18px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      border: 1px dashed rgba(0, 229, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- 1. Robot Banner -->
  <div class="banner-container">
    <img src="https://yuvarajyuva1234.github.io/Quantam-Dashboard/1000248634.png" onerror="this.src='https://yuvarajyuva1234.github.io/Quantam-Dashboard/1000248634_2.png'" alt="QuantumEdge Bot">
  </div>

  <!-- 2. Live Candlestick Chart -->
  <div class="hud-card">
    <div class="chart-box" id="tradingview_chart"></div>
  </div>

  <!-- 3. Market Bid & Trend -->
  <div class="hud-card market-box">
    <div>
      <div class="symbol-title">XAUUSD-VIP</div>
      <span class="trend-tag">BULLISH TREND</span>
    </div>
    <div class="bid-side">
      <div class="bid-num">4367.39</div>
      <div class="bid-lbl">LIVE BID</div>
    </div>
  </div>

  <!-- 4. Bot Button -->
  <div class="bot-btn">
    <div class="dot-pulse"></div>
    <span>AUTO BOT: RUNNING (ON)</span>
  </div>

  <!-- 5. Live Balance Only -->
  <div class="hud-card metric-row">
    <span class="metric-lbl">LIVE BALANCE</span>
    <span class="balance-txt">$98,968.11</span>
  </div>

  <!-- 6. Live Profit / Loss -->
  <div class="hud-card metric-row">
    <span class="metric-lbl">LIVE PROFIT / LOSS</span>
    <span class="profit-txt">+$0.00</span>
  </div>

  <!-- 7. Today P/L & Spread (From your MT5 screen) -->
  <div class="grid-2col">
    <div class="hud-card">
      <div class="metric-lbl">TODAY P/L</div>
      <div class="stat-val-sm" style="color: var(--neon-red);">-$39.18</div>
    </div>
    <div class="hud-card">
      <div class="metric-lbl">SPREAD</div>
      <div class="stat-val-sm" style="color: #00e5ff;">27 pts</div>
    </div>
  </div>

  <!-- 8. Active Orders (Zero Running) -->
  <div class="orders-header">
    <span class="orders-title">ACTIVE ORDERS</span>
    <span class="running-cnt" style="color: var(--text-dim);">0 RUNNING</span>
  </div>

  <div class="hud-card no-orders-box">
    NO ACTIVE ORDERS WAITING FOR SIGNAL...
  </div>

  <!-- TradingView Script -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script>
    new TradingView.widget({
      "autosize": true,
      "symbol": "OANDA:XAUUSD",
      "interval": "5",
      "timezone": "Asia/Kolkata",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#070d18",
      "enable_publishing": false,
      "hide_top_toolbar": true,
      "hide_legend": true,
      "save_image": false,
      "container_id": "tradingview_chart"
    });
  </script>
</body>
</html>
