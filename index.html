<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QE BOT Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #050b14;
      color: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Cyberpunk HUD Card */
    .neon-card {
      background: rgba(10, 25, 47, 0.85);
      border: 1.5px solid #00e5ff;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), 
                  inset 0 0 10px rgba(0, 229, 255, 0.1);
      position: relative;
      padding: 14px 16px;
      backdrop-filter: blur(8px);
    }

    .neon-card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 15%;
      width: 70%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ff88, transparent);
    }

    /* Account Header Box */
    .account-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-demo {
      background: rgba(255, 170, 0, 0.15);
      color: #ffaa00;
      border: 1px solid #ffaa00;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .badge-live {
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      border: 1px solid #00ff88;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .broker-info {
      color: #00e5ff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Balance & Profit Rows */
    .row-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-label {
      color: #8892b0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .balance-val {
      color: #00ff88;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    .profit-val {
      color: #00ff88;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
    }
  </style>
</head>
<body>

  <!-- Account Type & Broker / Account Number -->
  <div class="neon-card account-card">
    <span id="account-type" class="badge-demo">DEMO ACCOUNT</span>
    <span id="broker-name" class="broker-info">EXNESS: 12345678</span>
  </div>

  <!-- Single Live Balance Box -->
  <div class="neon-card row-card">
    <span class="stat-label">LIVE BALANCE</span>
    <span id="live-balance" class="balance-val">$98,968.11</span>
  </div>

  <!-- Live Profit / Loss -->
  <div class="neon-card row-card">
    <span class="stat-label">LIVE PROFIT / LOSS</span>
    <span id="live-profit" class="profit-val">+$0.00</span>
  </div>

  <script>
    function updateDashboard(isLive, broker, accNo, balance, profit) {
      const typeEl = document.getElementById("account-type");
      const brokerEl = document.getElementById("broker-name");
      const balanceEl = document.getElementById("live-balance");
      const profitEl = document.getElementById("live-profit");

      // Live / Demo Switch
      if (isLive) {
        typeEl.innerText = "REAL ACCOUNT";
        typeEl.className = "badge-live";
      } else {
        typeEl.innerText = "DEMO ACCOUNT";
        typeEl.className = "badge-demo";
      }

      // Broker & Number
      brokerEl.innerText = `${broker}: ${accNo}`;

      // Balance
      balanceEl.innerText = `$${balance.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;

      // Profit / Loss
      profitEl.innerText = (profit >= 0 ? `+$${profit.toFixed(2)}` : `-$${Math.abs(profit).toFixed(2)}`);
      profitEl.style.color = profit >= 0 ? "#00ff88" : "#ff4444";
    }

    // Example Usage:
    // Arguments: isLive (true/false), BrokerName, AccountNumber, Balance, Profit
    updateDashboard(false, "EXNESS", "8492019", 98968.11, 0.00);
  </script>
</body>
</html>
